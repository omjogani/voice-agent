[project]
name = "learn-livekit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "livekit-agents[silero,sileroo,turn-detection,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "msgpack>=1.1.2",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=7.4.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
